# Dependabot version updates.
#
# This file only makes Dependabot open pull requests for newer versions.
# Dependabot alerts and Dependabot security updates are repository settings.
# The owner turns them on in Settings, under "Advanced Security".
version: 2
updates:
  # The root package.json. Users copy its test dependencies into their apps,
  # so the ranges here should stay current.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Packages that must move together arrive in one pull request.
      #
      # A pull request that moves @playwright/cli fails the CI job "Copied
      # playwright-cli skill" until the copy in .cursor/skills/playwright-cli/
      # is made again. On its branch, run `npm ci`, then
      # `node scripts/ci/playwright-cli-skill.mjs --write`, and commit the result.
      playwright:
        patterns:
          - "@playwright/*"
      vitest:
        patterns:
          - vitest
          - "@vitest/*"
      testing-library:
        patterns:
          - "@testing-library/*"

  # The example app. Its package.json holds only the app's own packages.
  # scripts/install-into.mjs adds the test dependencies from the root
  # package.json when the example is tested, so the three groups above
  # have nothing to match here.
  - package-ecosystem: npm
    directory: /examples/next-app
    schedule:
      interval: weekly
    groups:
      # react and react-dom must have the same version.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"

  # The React Native example app. Its package.json also holds the version
  # ranges that scripts/install-into.mjs gives a React Native app for the dev
  # dependencies in README.md's React Native list, so they stay current here.
  # Expo pins the versions of react, react-native, and its own packages to one
  # SDK: move the SDK with `npx expo install expo@latest --fix` on a branch,
  # not package by package.
  - package-ecosystem: npm
    directory: /examples/expo-app
    schedule:
      interval: weekly
    groups:
      testing:
        patterns:
          - jest
          - jest-expo
          - "@types/jest"
          - "@testing-library/*"
          - test-renderer
    ignore:
      - dependency-name: expo
        update-types: ["version-update:semver-major"]
      - dependency-name: react-native
      - dependency-name: react
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major"]
      # Its major version is the Expo SDK, so it moves with expo.
      - dependency-name: jest-expo
        update-types: ["version-update:semver-major"]
      # Each Expo SDK expects one TypeScript line: SDK 58 expects ~6.0.
      # `npx expo install --check` names it. Move it with the SDK (#52).
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  # The actions that .github/workflows/ pins.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
