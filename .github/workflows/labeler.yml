# Adds labels to a pull request by the files it changes. The rules are in
# .github/labeler.yml.
#
# The event is pull_request_target, so the job may label a pull request from a
# fork. It runs the workflow and the rules of the main branch, and it checks
# out no code of the pull request.

name: Label pull requests

on:
  pull_request_target:

permissions:
  contents: read

jobs:
  label:
    name: Label by changed files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
      # The labeler adds a label through the issues API.
      issues: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
