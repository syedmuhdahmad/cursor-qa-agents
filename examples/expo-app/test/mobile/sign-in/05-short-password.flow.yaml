# plan: test/mobile/plan/sign-in.plan.md
# scenario: 2.3 Password shorter than 8 characters is rejected
appId: ${APP_ID}
name: "Password shorter than 8 characters is rejected"
tags:
  - sign-in
---
- runFlow: ../elements/load.yaml
# 1. Launch the app with cleared state.
- launchApp:
    clearState: true
    clearKeychain: true
# 2. On the Sign in screen, type `ada@example.com` into "Email".
- tapOn:
    id: ${output.signIn.email}
- inputText: "ada@example.com"
# 3. On the Sign in screen, type `short` into "Password".
- tapOn:
    id: ${output.signIn.password}
- inputText: "short"
# 4. On the Sign in screen, tap "Sign in".
- hideKeyboard
- tapOn:
    id: ${output.signIn.signIn}
# Expect: On the Sign in screen, "Password must be at least 8 characters" is visible.
- assertVisible:
    id: ${output.signIn.passwordMustBeAtLeast8Characters}
    text: "Password must be at least 8 characters"
