# plan: test/mobile/plan/sign-in.plan.md
# scenario: 3.1 Wrong password shows an error
appId: ${APP_ID}
name: "Wrong password shows an error"
tags:
  - sign-in
---
- runFlow: ../elements/load.yaml
# 1. Launch the app with cleared state.
- launchApp:
    clearState: true
    clearKeychain: true
# 2. On the Sign in screen, type `ada@example.com` into "Email".
- tapOn:
    id: ${output.signIn.email}
- inputText: "ada@example.com"
# 3. On the Sign in screen, type `wrong-password` into "Password".
- tapOn:
    id: ${output.signIn.password}
- inputText: "wrong-password"
# 4. On the Sign in screen, tap "Sign in".
- hideKeyboard
- tapOn:
    id: ${output.signIn.signIn}
# Expect: On the Sign in screen, "Email or password is incorrect" is visible.
- assertVisible:
    id: ${output.signIn.emailOrPasswordIsIncorrect}
    text: "Email or password is incorrect"
